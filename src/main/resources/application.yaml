spring:
  application:
    name: ecommerce-backend


  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    #    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false


  main:
    # Turns off the Spring ASCII Art
    banner-mode: "off"
    # Optional: Silences startup info logs but keeps errors
#    log-startup-info: false